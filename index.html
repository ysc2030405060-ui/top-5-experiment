<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>최상위 .5 실험 #001</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #07090d;
  color: white;
  font-family: Arial, "Noto Sans KR", sans-serif;
}

body {
  overflow-x: hidden;
  overflow-y: auto;
}

.app {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 18px 14px 40px;
}

.brand {
  text-align: center;
  color: #ffd84d;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 2px;
  margin-top: 4px;
}

h1 {
  text-align: center;
  font-size: 25px;
  margin: 10px 0 6px;
}

.question {
  text-align: center;
  color: #d6d9df;
  font-size: 16px;
  line-height: 1.45;
  margin-bottom: 16px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.stat {
  background: #11151d;
  border: 1px solid #242a35;
  border-radius: 13px;
  padding: 10px 4px;
  text-align: center;
}

.stat .number {
  color: #ffd84d;
  font-size: 21px;
  font-weight: 900;
}

.stat .label {
  color: #9299a7;
  font-size: 11px;
  margin-top: 3px;
}

.arena {
  position: relative;
  width: 100%;
  height: clamp(300px, 48dvh, 455px);
  background:
    radial-gradient(circle at center, #151b27 0%, #090c12 70%);
  border: 1px solid #252c39;
  border-radius: 18px;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.intro {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  background: rgba(7,9,13,.91);
}

.dna {
  font-size: 54px;
  margin-bottom: 8px;
}

.intro-title {
  font-size: 20px;
  font-weight: 900;
  margin-bottom: 7px;
}

.intro-text {
  color: #aeb5c1;
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 22px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 15px 12px;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
}

.start-btn,
.grade-btn {
  background: #ffd84d;
  color: #101010;
}

.start-btn {
  max-width: 270px;
}

.timer-area {
  margin-top: 12px;
}

.timer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  color: #9ca4b1;
  margin-bottom: 6px;
}

#timer {
  color: white;
  font-size: 20px;
  font-weight: 900;
}

.progress {
  width: 100%;
  height: 7px;
  background: #1b2029;
  border-radius: 99px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 100%;
  background: #ffd84d;
  transform-origin: left center;
}

.legend {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin: 11px 0 2px;
  color: #89919e;
  font-size: 11px;
}

.dot {
  width: 8px;
  height: 8px;
  display: inline-block;
  border-radius: 50%;
  margin-right: 4px;
}

.blue { background: #42a5ff; }
.yellow { background: #ffd84d; }
.green { background: #4be38b; }

.result {
  display: none;
  margin-top: 18px;
  background: #10141c;
  border: 1px solid #292f3b;
  border-radius: 18px;
  padding: 20px 16px;
  text-align: center;
}

.result.show {
  display: block;
}

.result-title {
  color: #ffd84d;
  font-size: 16px;
  font-weight: 900;
}

.result-numbers {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin: 16px 0;
}

.result-num strong {
  display: block;
  font-size: 32px;
}

.result-num span {
  color: #949ba8;
  font-size: 12px;
}

.result-text {
  color: #d4d8df;
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 16px;
}

.grade-btn {
  margin-top: 4px;
}

.restart-btn {
  margin-top: 9px;
  background: #202631;
  color: white;
}

.footer {
  text-align: center;
  color: #515967;
  font-size: 11px;
  margin-top: 20px;
}

@media (max-height: 700px) {
  .arena {
    height: 310px;
  }

  h1 {
    font-size: 22px;
  }

  .app {
    padding-top: 10px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="brand">🧪 TOP .5 EXPERIMENT</div>

  <h1>최상위 .5 실험 #001</h1>

  <div class="question">
    생명체 100마리에게<br>
    먹이 30개만 주면?
  </div>

  <div class="stats">

    <div class="stat">
      <div class="number">100</div>
      <div class="label">생명체</div>
    </div>

    <div class="stat">
      <div class="number">30</div>
      <div class="label">먹이</div>
    </div>

    <div class="stat">
      <div class="number">10.0</div>
      <div class="label">실험 시간(초)</div>
    </div>

  </div>

  <div class="arena">

    <canvas id="canvas"></canvas>

    <div class="intro" id="intro">

      <div class="dna">🧬</div>

      <div class="intro-title">
        생존 실험 준비 완료
      </div>

      <div class="intro-text">
        먹이를 먹은 생명체만 살아남습니다.<br>
        10초 후 몇 마리가 생존할까요?
      </div>

      <button class="start-btn" id="startBtn">
        ▶ 실험 시작
      </button>

    </div>

  </div>

  <div class="timer-area">

    <div class="timer-row">
      <span>남은 시간</span>
      <span id="timer">10.0</span>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

  </div>

  <div class="legend">
    <span><i class="dot blue"></i>미섭취</span>
    <span><i class="dot yellow"></i>먹이 섭취</span>
    <span><i class="dot green"></i>먹이</span>
  </div>

  <div class="result" id="result">

    <div class="result-title">
      🧪 실험 종료
    </div>

    <div class="result-numbers">

      <div class="result-num">
        <strong id="survivors">0</strong>
        <span>생존</span>
      </div>

      <div class="result-num">
        <strong id="eliminated">0</strong>
        <span>탈락</span>
      </div>

    </div>

    <div class="result-text" id="resultText"></div>

    <button class="grade-btn" id="gradeBtn">
      🧪 당신의 실험 등급 확인하기
    </button>

    <button class="restart-btn" id="restartBtn">
      ↻ 다시 실험하기
    </button>

  </div>

  <div class="footer">
    TOP .5 EXPERIMENT · #001
  </div>

</div>

<script>

const CREATURE_COUNT = 100;
const FOOD_COUNT = 30;
const DURATION = 10;

const YOUTUBE_URL =
  "https://youtube.com/shorts/68GRplRRDRQ";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const intro = document.getElementById("intro");
const startBtn = document.getElementById("startBtn");

const timerEl = document.getElementById("timer");
const progressBar = document.getElementById("progressBar");

const result = document.getElementById("result");
const survivorsEl = document.getElementById("survivors");
const eliminatedEl = document.getElementById("eliminated");
const resultText = document.getElementById("resultText");

const gradeBtn = document.getElementById("gradeBtn");
const restartBtn = document.getElementById("restartBtn");

let creatures = [];
let foods = [];

let running = false;
let startTime = 0;
let animationId = null;

let width = 0;
let height = 0;

function resizeCanvas() {

  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  width = rect.width;
  height = rect.height;

  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

}

function random(min, max) {
  return Math.random() * (max - min) + min;
}

function createExperiment() {

  creatures = [];
  foods = [];

  for (let i = 0; i < CREATURE_COUNT; i++) {

    creatures.push({
      x: random(8, width - 8),
      y: random(8, height - 8),
      speed: random(0.75, 1.35),
      eaten: 0,
      angle: random(0, Math.PI * 2)
    });

  }

  for (let i = 0; i < FOOD_COUNT; i++) {

    foods.push({
      x: random(10, width - 10),
      y: random(10, height - 10),
      alive: true
    });

  }

}

function nearestFood(creature) {

  let nearest = null;
  let nearestDistance = Infinity;

  for (const food of foods) {

    if (!food.alive) continue;

    const dx = food.x - creature.x;
    const dy = food.y - creature.y;

    const distance = dx * dx + dy * dy;

    if (distance < nearestDistance) {
      nearestDistance = distance;
      nearest = food;
    }

  }

  return nearest;
}

function updateCreatures() {

  for (const creature of creatures) {

    const food = nearestFood(creature);

    if (food) {

      const dx = food.x - creature.x;
      const dy = food.y - creature.y;

      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance > 0) {

        creature.x += (dx / distance) * creature.speed;
        creature.y += (dy / distance) * creature.speed;

      }

      if (distance < 6) {

        food.alive = false;
        creature.eaten += 1;

      }

    } else {

      creature.x += Math.cos(creature.angle) * 0.3;
      creature.y += Math.sin(creature.angle) * 0.3;

    }

    creature.x = Math.max(4, Math.min(width - 4, creature.x));
    creature.y = Math.max(4, Math.min(height - 4, creature.y));

  }

}

function draw() {

  ctx.clearRect(0, 0, width, height);

  for (const food of foods) {

    if (!food.alive) continue;

    ctx.beginPath();
    ctx.arc(food.x, food.y, 3.5, 0, Math.PI * 2);

    ctx.fillStyle = "#4be38b";
    ctx.shadowColor = "#4be38b";
    ctx.shadowBlur = 8;

    ctx.fill();

  }

  ctx.shadowBlur = 0;

  for (const creature of creatures) {

    ctx.beginPath();
    ctx.arc(creature.x, creature.y, 3, 0, Math.PI * 2);

    if (creature.eaten > 0) {

      ctx.fillStyle = "#ffd84d";
      ctx.shadowColor = "#ffd84d";

    } else {

      ctx.fillStyle = "#42a5ff";
      ctx.shadowColor = "#42a5ff";

    }

    ctx.shadowBlur = 5;
    ctx.fill();

  }

  ctx.shadowBlur = 0;

}

function animate(timestamp) {

  if (!running) return;

  const elapsed = (timestamp - startTime) / 1000;
  const remaining = Math.max(0, DURATION - elapsed);

  timerEl.textContent = remaining.toFixed(1);

  progressBar.style.transform =
    `scaleX(${remaining / DURATION})`;

  updateCreatures();
  draw();

  if (remaining <= 0) {

    finishExperiment();
    return;

  }

  animationId = requestAnimationFrame(animate);

}

function startExperiment() {

  resizeCanvas();
  createExperiment();

  result.classList.remove("show");

  intro.style.display = "none";

  timerEl.textContent = DURATION.toFixed(1);
  progressBar.style.transform = "scaleX(1)";

  running = true;

  startTime = performance.now();

  draw();

  animationId = requestAnimationFrame(animate);

}

function finishExperiment() {

  running = false;

  if (animationId) {
    cancelAnimationFrame(animationId);
  }

  timerEl.textContent = "0.0";
  progressBar.style.transform = "scaleX(0)";

  const survivors =
    creatures.filter(creature => creature.eaten > 0).length;

  const eliminated =
    CREATURE_COUNT - survivors;

  survivorsEl.textContent = survivors;
  eliminatedEl.textContent = eliminated;

  resultText.textContent =
    `100마리 중 ${survivors}마리가 살아남았습니다.`;

  result.classList.add("show");

  setTimeout(() => {

    result.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }, 250);

}

function resetExperiment() {

  running = false;

  if (animationId) {
    cancelAnimationFrame(animationId);
  }

  result.classList.remove("show");

  intro.style.display = "flex";

  timerEl.textContent = DURATION.toFixed(1);
  progressBar.style.transform = "scaleX(1)";

  resizeCanvas();
  createExperiment();
  draw();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

startBtn.addEventListener("click", startExperiment);

restartBtn.addEventListener("click", resetExperiment);

gradeBtn.addEventListener("click", () => {
  window.location.href = YOUTUBE_URL;
});

window.addEventListener("resize", () => {

  resizeCanvas();

  if (!running) {
    createExperiment();
  }

  draw();

});

resizeCanvas();
createExperiment();
draw();

</script>

</body>
</html>
